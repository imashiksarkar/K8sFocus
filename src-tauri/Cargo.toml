[package]
name = "k8sfocus"
version = "0.1.0"
description = "K8sFocus — a desktop Kubernetes client"
authors = ["Ashik Sarkar"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "k8sfocus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kube = { version = "1", default-features = false, features = ["client", "config", "runtime", "rustls-tls", "jsonpatch", "ws"] }
k8s-openapi = { version = "0.25", features = ["v1_33"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
serde_yaml = "0.9.34"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = "0.3.34"
json-patch = "4"
tauri-plugin-dialog = "2"
base64 = "0.23.1"
portable-pty = "0.9.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
