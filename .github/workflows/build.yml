name: Build installers

# Manual trigger only. Download installers from the run's "Artifacts" section.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build"
        type: choice
        default: all
        options: [all, macos, linux, windows]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job-level `if` can't see `matrix`, so build the filtered matrix here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          all='[
            {"name":"macos-arm64","family":"macos","os":"macos-latest","target":"aarch64-apple-darwin","bundles":"dmg,app"},
            {"name":"macos-x64","family":"macos","os":"macos-latest","target":"x86_64-apple-darwin","bundles":"dmg,app"},
            {"name":"linux-x64","family":"linux","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage,rpm"},
            {"name":"windows-x64","family":"windows","os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis,msi"}
          ]'
          sel=$(echo "$all" | jq -c --arg p "$PLATFORMS" '[.[] | select($p == "all" or .family == $p)]')
          echo "matrix={\"include\":$sel}" >> "$GITHUB_OUTPUT"
          echo "$sel" | jq .

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: k8sfocus-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
